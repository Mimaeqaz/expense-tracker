<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#162033">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daily Expense Tracker</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--acc:#059669;--accb:#10b981;--exp:#ea580c;--inc:#059669;--sel:#f0fdf4;--soft:#f8fafc;--dark:#162033;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2b;--ink:#e5ecf6;--mute:#8a9ab0;--line:#223048;--acc:#34d399;--exp:#fb923c;--inc:#4ade80;--sel:#12301f;--soft:#0e1626;--dark:#1b2940}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111a2b;--ink:#e5ecf6;--mute:#8a9ab0;--line:#223048;--acc:#34d399;--exp:#fb923c;--inc:#4ade80;--sel:#12301f;--soft:#0e1626;--dark:#1b2940}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.4}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;gap:14px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:1.3rem;margin:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sum small{color:var(--mute);display:block;font-size:.78rem}
.sum b{font-size:1.2rem}
.exp{color:var(--exp)}.inc{color:var(--inc)}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
button.primary{background:var(--accb);border-color:var(--accb);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.nav h2{margin:0;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{text-align:center;color:var(--mute);font-size:.75rem;font-weight:600;padding:8px 0;background:var(--soft);border-bottom:1px solid var(--line)}
.day{position:relative;min-height:108px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:var(--card);padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day:nth-child(7n){border-right:0}
.day.off{background:var(--soft);cursor:default}
.day:not(.off):hover{background:var(--sel)}
.day .n{font-weight:600;font-size:.85rem;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.day.today .n{color:var(--acc);font-weight:800}
.day.sel{background:var(--sel);outline:2px solid var(--accb);outline-offset:-2px;z-index:1}
.day.sel .n{background:var(--acc);color:#fff}
.chip{font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zero{font-size:.68rem;color:var(--mute)}
.day{cursor:pointer}.day.off{cursor:default}
.plus{position:absolute;right:6px;bottom:6px;width:26px;height:26px;padding:0;border-radius:50%;background:var(--soft);color:var(--mute);font-size:1.1rem;line-height:1;opacity:0}
.plus:hover,.plus:focus-visible{background:var(--accb);border-color:var(--accb);color:#fff;opacity:1}
.day:hover .plus,.day.sel .plus{opacity:1}
@media(hover:none){.plus{opacity:.6}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:12px}
.ph{background:var(--dark);color:#fff;padding:16px;display:flex;justify-content:space-between;gap:10px}
.ph small{color:var(--accb);font-weight:700;font-size:.72rem}
.ph h3{margin:4px 0;font-size:1.05rem}
.ph .t{font-size:1.5rem;font-weight:800}
.ph .t em{font-size:.75rem;font-weight:400;font-style:normal;opacity:.8}
.ph .e{font-size:.8rem;color:#86efac}
.st{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:.78rem;color:var(--mute)}
.st button{border:0;background:none;color:var(--acc);font-weight:600;padding:2px}
.body{padding:8px 16px 16px;min-height:150px}
.empty{text-align:center;color:var(--mute);padding:34px 0 0}
.empty button{margin-top:10px;background:var(--soft)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--mute);display:block}
li button{padding:2px 8px;font-size:.78rem}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:3px;font-size:.8rem;color:var(--mute)}
.form input,.form select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);width:100%}
.full{grid-column:1/-1}
.crow{display:flex;gap:6px;margin-bottom:6px}.crow input{flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
@media(max-width:860px){.layout{grid-template-columns:1fr}.panel{position:static}}
@media(max-width:560px){.day{min-height:62px;padding:4px}.chip{font-size:.62rem}.zero{display:none}.sum b{font-size:1rem}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Daily Expense Tracker</h1><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="sync" style="font-size:.78rem;color:var(--mute)">Saved on this device only</span><button id="cats">Edit categories</button><button id="signin">Sign in with Google</button><button id="exp">Export backup</button><button id="imp">Import backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></div>
<section class="sum" aria-label="Monthly totals">
<div><small>Earnings this month</small><b class="inc" id="mi"></b></div>
<div><small>Expenses this month</small><b class="exp" id="me"></b></div>
<div><small>Balance</small><b id="mb"></b></div>
</section>
<div class="layout">
<section class="cal">
<div class="nav"><button id="prev" aria-label="Previous month">&lt;</button><h2 id="title"></h2><button id="next" aria-label="Next month">&gt;</button></div>
<div class="grid" id="dows"></div>
<div class="grid" id="cal"></div>
</section>
<aside class="panel">
<div class="ph"><div><small>SELECTED DAY DETAILS</small><h3 id="dt"></h3><div class="t"><span id="dtot"></span> <em id="dcnt"></em></div><div class="e" id="dinc"></div></div><div><button class="primary" id="addTop">+ Add</button></div></div>
<div class="st"><span id="status"></span><button id="zeroBtn">Mark Zero Spend</button></div>
<div class="body" id="body"></div>
</aside>
</div>
</main>
<dialog id="dlg">
<h3 id="dlgTitle"></h3>
<div class="tabs"><button id="tE" class="on">Expense</button><button id="tI">Earning</button></div>
<div class="form">
<label class="full">Item<input id="name" placeholder="e.g. Lunch"></label>
<label>Type<select id="type"></select></label>
<label>Amount (each)<input id="amt" type="number" min="0" step="0.01" inputmode="decimal"></label>
<label id="qtyL" class="full">How many<input id="qty" type="number" min="1" step="1" value="1" inputmode="numeric"></label>
</div>
<div id="err" class="exp" style="margin-top:6px"></div>
<div class="acts"><button id="cancel">Cancel</button><button class="primary" id="add">Add expense</button></div>
</dialog>
<dialog id="cdlg">
<h3>Edit categories</h3>
<div class="tabs"><button id="cE" class="on">Expense</button><button id="cI">Earning</button></div>
<div id="clist"></div>
<p style="font-size:.75rem;color:var(--mute);margin:4px 0 8px">Renaming updates your existing entries. Deleting only removes it from the list; old entries keep their label.</p>
<div class="acts" style="justify-content:space-between"><div style="display:flex;gap:6px;flex:1"><input id="cnew" placeholder="New category" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft)"><button class="primary" id="cadd">Add</button></div><button id="cdone">Done</button></div>
</dialog>
<script>
var P="\u20B1",KEY="expense-tracker-v1",ZKEY="expense-tracker-zero-v1";
var TYPES={e:["Food","Transport","School","Bills","Shopping","Health","Entertainment","Other"],i:["Salary","Allowance","Other"]};
function load(k){try{return JSON.parse(localStorage.getItem(k)||"[]")}catch(e){return[]}}
var data=load(KEY),zeros=load(ZKEY);
try{var tt=JSON.parse(localStorage.getItem("expense-tracker-types-v1"));if(tt&&tt.e&&tt.i)TYPES=tt}catch(e){}
var TKEY="expense-tracker-t-v1",lt=0,cdoc=null;try{lt=+localStorage.getItem(TKEY)||0}catch(e){}
function store(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(ZKEY,JSON.stringify(zeros));localStorage.setItem(TKEY,lt);localStorage.setItem("expense-tracker-types-v1",JSON.stringify(TYPES))}catch(e){}}
function push(){if(cdoc)cdoc.set({json:JSON.stringify({data:data,zeros:zeros,types:TYPES,t:lt})}).catch(function(){setSync("Cloud save failed - kept on this device")})}
function save(){lt=Date.now();store();push()}
function setSync(t){var e=document.getElementById("sync");if(e)e.textContent=t}
function uni(a,b){var o={};a.concat(b).forEach(function(x){o[x.id]=x});return Object.keys(o).map(function(k){return o[k]})}
function uz(a,b){return a.concat(b.filter(function(x){return a.indexOf(x)<0}))}
var now=new Date(),y=now.getFullYear(),m=now.getMonth(),sel=iso(now),kind="e";
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function money(n){return P+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
function tot(x){return x.amt*x.qty}
function sums(l){var e=0,i=0;l.forEach(function(x){if(x.kind==="e")e+=tot(x);else i+=tot(x)});return{e:e,i:i}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var $=function(id){return document.getElementById(id)};
$("dows").innerHTML=["SUN","MON","TUE","WED","THU","FRI","SAT"].map(function(d){return '<div class="dow">'+d+"</div>"}).join("");
function setKind(k){kind=k;$("tE").classList.toggle("on",k==="e");$("tI").classList.toggle("on",k==="i");
fillTypes(k);
$("qtyL").style.display=k==="e"?"grid":"none";$("add").textContent=k==="e"?"Add expense":"Add earning";
$("name").placeholder=k==="e"?"e.g. Lunch":"e.g. Monthly pay (optional)"}
var editId=null;
function fillTypes(k,cur){var l=TYPES[k].slice();if(cur&&l.indexOf(cur)<0)l.push(cur);$("type").innerHTML=l.map(function(t){return "<option>"+esc(t)+"</option>"}).join("");if(cur)$("type").value=cur}
function openDlg(k,x){editId=x?x.id:null;setKind(x?x.kind:(k||"e"));$("err").textContent="";
if(x){fillTypes(x.kind,x.type);$("name").value=x.name||"";$("amt").value=x.amt;$("qty").value=x.qty;$("add").textContent="Save changes"}
else{$("name").value="";$("amt").value="";$("qty").value=1}
$("tE").parentNode.style.display=x?"none":"";
$("dlgTitle").textContent=(x?"Edit entry for ":"Add entry for ")+new Date(sel+"T00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
$("dlg").showModal();$("name").focus()}
function render(){
var first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),h="",pre=y+"-"+String(m+1).padStart(2,"0");
$("title").textContent=first.toLocaleString(undefined,{month:"long",year:"numeric"});
for(var b=0;b<first.getDay();b++)h+='<div class="day off"></div>';
for(var d=1;d<=days;d++){var k=iso(new Date(y,m,d)),s=sums(data.filter(function(x){return x.date===k}));
h+='<div class="day'+(k===sel?" sel":"")+(k===iso(now)?" today":"")+'" data-d="'+k+'" tabindex="0" role="button" aria-label="Select '+k+'"><span class="n">'+d+"</span>"+(s.i?'<span class="chip inc">+'+money(s.i)+"</span>":"")+(s.e?'<span class="chip exp">-'+money(s.e)+"</span>":"")+(!s.e&&!s.i&&zeros.indexOf(k)>-1?'<span class="zero">Zero spend</span>':"")+'<button class="plus" data-add="'+k+'" aria-label="Add entry for '+k+'">+</button></div>'}
var rem=(7-(first.getDay()+days)%7)%7;for(var r=0;r<rem;r++)h+='<div class="day off"></div>';
$("cal").innerHTML=h;
var ms=sums(data.filter(function(x){return x.date.indexOf(pre)===0}));
$("mi").textContent=money(ms.i);$("me").textContent=money(ms.e);$("mb").textContent=money(ms.i-ms.e);
var dl=data.filter(function(x){return x.date===sel}),ds=sums(dl),ez=dl.filter(function(x){return x.kind==="e"}).length,isZ=zeros.indexOf(sel)>-1;
$("dt").textContent=new Date(sel+"T00:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});
$("dtot").textContent=money(ds.e);$("dcnt").textContent="("+ez+" item"+(ez===1?"":"s")+")";
$("dinc").textContent=ds.i?"+"+money(ds.i)+" earned":"";
$("status").textContent="Status: "+(dl.length?dl.length+" entr"+(dl.length===1?"y":"ies"):isZ?"Zero spend day":"No entries yet");
$("zeroBtn").style.display=dl.length?"none":"";$("zeroBtn").textContent=isZ?"Undo Zero Spend":"Mark Zero Spend";
$("body").innerHTML=dl.length?"<ul>"+dl.map(function(x){return "<li><div><b>"+esc(x.name||x.type)+"</b><small>"+x.type+(x.kind==="e"?" \u2022 "+x.qty+" \u00D7 "+money(x.amt):" \u2022 Earning")+'</small></div><div><b class="'+(x.kind==="e"?"exp":"inc")+'">'+(x.kind==="e"?"-":"+")+money(tot(x))+'</b> <button data-e="'+x.id+'" aria-label="Edit entry">Edit</button> <button data-x="'+x.id+'" aria-label="Delete entry">Delete</button></div></li>'}).join("")+"</ul>":'<div class="empty">No expenses logged for this date.<br><button id="first">+ Log first expense</button></div>'}
$("cal").onclick=function(e){var p=e.target.closest("[data-add]"),b=e.target.closest("[data-d]");if(p){sel=p.dataset.add;render();openDlg("e")}else if(b){sel=b.dataset.d;render()}};
$("cal").onkeydown=function(e){var b=e.target.closest&&e.target.closest("[data-d]");if(b&&e.target===b&&(e.key==="Enter"||e.key===" ")){e.preventDefault();sel=b.dataset.d;render()}};
$("body").onclick=function(e){var b=e.target.closest("[data-x]");if(b){data=data.filter(function(x){return String(x.id)!==b.dataset.x});save();render()}var ed=e.target.closest("[data-e]");if(ed){var q=data.filter(function(z){return String(z.id)===ed.dataset.e})[0];if(q)openDlg(null,q)}if(e.target.id==="first")openDlg("e")};
$("addTop").onclick=function(){openDlg("e")};
$("zeroBtn").onclick=function(){var i=zeros.indexOf(sel);if(i>-1)zeros.splice(i,1);else zeros.push(sel);save();render()};
$("prev").onclick=function(){m--;if(m<0){m=11;y--}render()};
$("next").onclick=function(){m++;if(m>11){m=0;y++}render()};
$("tE").onclick=function(){setKind("e")};$("tI").onclick=function(){setKind("i")};
$("cancel").onclick=function(){$("dlg").close()};
$("add").onclick=function(){
var amt=parseFloat($("amt").value),qty=kind==="e"?parseInt($("qty").value,10):1;
if(!(amt>0)){$("err").textContent="Enter an amount greater than 0.";return}
if(!(qty>=1)){$("err").textContent="Enter how many (at least 1).";return}
var zi=zeros.indexOf(sel);if(zi>-1)zeros.splice(zi,1);
if(editId!==null){var ex=data.filter(function(z){return z.id===editId})[0];if(ex){ex.kind=kind;ex.type=$("type").value;ex.name=$("name").value.trim();ex.amt=amt;ex.qty=qty}editId=null}else data.push({id:Date.now()+Math.random(),date:sel,kind:kind,type:$("type").value,name:$("name").value.trim(),amt:amt,qty:qty});
save();$("name").value="";$("amt").value="";$("qty").value=1;$("dlg").close();render()};
setKind("e");render();
var ck="e";
function renderCats(){$("cE").classList.toggle("on",ck==="e");$("cI").classList.toggle("on",ck==="i");
$("clist").innerHTML=TYPES[ck].map(function(t,i){return '<div class="crow"><input value="'+esc(t)+'" data-i="'+i+'" aria-label="Category name"><button data-del="'+i+'">Delete</button></div>'}).join("")}
$("cats").onclick=function(){ck="e";renderCats();$("cdlg").showModal()};
$("cE").onclick=function(){ck="e";renderCats()};$("cI").onclick=function(){ck="i";renderCats()};
$("clist").onchange=function(e){var i=+e.target.dataset.i,old=TYPES[ck][i],nv=e.target.value.trim();
if(!nv||(nv!==old&&TYPES[ck].indexOf(nv)>-1)){e.target.value=old;return}
if(nv!==old){data.forEach(function(x){if(x.kind===ck&&x.type===old)x.type=nv});TYPES[ck][i]=nv;save();render()}};
$("clist").onclick=function(e){var b=e.target.closest("[data-del]");if(b&&TYPES[ck].length>1){TYPES[ck].splice(+b.dataset.del,1);save();renderCats()}};
$("cadd").onclick=function(){var v=$("cnew").value.trim();if(v&&TYPES[ck].indexOf(v)<0){TYPES[ck].push(v);save()}$("cnew").value="";renderCats()};
$("cnew").onkeydown=function(e){if(e.key==="Enter")$("cadd").onclick()};
$("cdone").onclick=function(){$("cdlg").close()};
$("exp").onclick=async function(){var txt=JSON.stringify({data:data,zeros:zeros,types:TYPES},null,1),fn="expense-backup-"+iso(new Date())+".json";
try{var dl=window.claude&&claude.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:fn,data:txt});return}}catch(e){}
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=fn;a.click()};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);data=uni(data,j.data||[]);zeros=uz(zeros,j.zeros||[]);if(j.types){["e","i"].forEach(function(k){if(j.types[k])TYPES[k]=uz(TYPES[k],j.types[k])})}save();render();setSync("Backup imported")}catch(e){alert("That file isn't a valid backup.")}};r.readAsText(f);this.value=""};
(async function(){try{
if(!window.claude||!claude.use)return;
var db=await claude.use("db"),us=await claude.use("user");if(!db||!us)return;
var id=await us.id();if(!id)return;
var ref=db.collection("data/users/"+id).doc("tracker"),first=true,ok="\u2601 Synced to your account";
cdoc=ref;
ref.onSnapshot(function(sn){
if(!sn.exists){if(first){first=false;if(data.length||zeros.length){lt=lt||Date.now();push()}setSync(ok)}return}
var r;try{r=JSON.parse(sn.data().json)}catch(e){return}
if(first&&lt===0&&(data.length||zeros.length)){first=false;data=uni(data,r.data||[]);zeros=uz(zeros,r.zeros||[]);save();render();setSync(ok);return}
first=false;
if((r.t||0)>lt){data=r.data||[];zeros=r.zeros||[];if(r.types&&r.types.e&&r.types.i)TYPES=r.types;lt=r.t;store();render()}
setSync(ok)},function(){setSync("Saved on this device only")});
}catch(e){}})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
var cfg={apiKey:"AIzaSyBJnLHfYeyfIIZo8ecuPUzj_7RW1pzwNpk",authDomain:"daily-expense-tracker-ff1df.firebaseapp.com",projectId:"daily-expense-tracker-ff1df",storageBucket:"daily-expense-tracker-ff1df.firebasestorage.app",messagingSenderId:"16550269336",appId:"1:16550269336:web:ded2d0f422b9ae88825bed"};
